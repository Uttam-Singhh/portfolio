<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Uttam is a polymath based in New York City building in crypto, AI, and payments.">
  <meta name="theme-color" content="#050a18">
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="scrim" aria-hidden="true"></div>

  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader-inner">
      <span class="loader-count" id="loaderCount">000</span>
      <span class="loader-bar"><i id="loaderBar"></i></span>
    </div>
  </div>

  <div class="progress" id="progress" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>

  <header class="nav">
    <div class="pill">
      <a class="mark" href="#top" aria-label="Back to top"><span id="mark">U</span></a>
      <nav aria-label="Sections">
        <a href="#about">About</a>
        <a href="#work">Work</a>
        <a href="#talks">Talks</a>
        <a href="#contact">Contact</a>
      </nav>
      <a class="status" href="#contact"><i></i><span id="status"></span></a>
    </div>
  </header>

  <aside class="hud hud-l" aria-hidden="true"><span id="clock">00:00:00</span></aside>
  <aside class="hud hud-r" aria-hidden="true"><span><span class="k">scroll</span>: <span id="sunrise">0.00</span></span></aside>

  <main>
    <section class="hero" id="top">
      <div class="hero-inner" id="heroInner">
        <div class="faces" id="faces"></div>
        <h1 class="name" id="name"></h1>
        <p class="role"><span id="role"></span><i class="caret"></i></p>
        <p class="tagline" id="tagline"></p>
        <div class="actions">
          <a class="btn solid" href="#work">View work <span>→</span></a>
          <a class="btn ghost" href="#contact">Say hello</a>
        </div>
      </div>
      <a class="scroll-cue" href="#about"><i></i>Scroll</a>
    </section>

    <section class="about" id="about">
      <header class="label reveal"><b>01</b><span>About</span></header>
      <p class="statement reveal" id="statement"></p>
      <dl class="facts reveal" id="facts"></dl>
    </section>

    <section class="work" id="work">
      <header class="label reveal"><b>02</b><span>Selected work</span></header>
      <div class="cards" id="cards"></div>
    </section>

    <section class="talks" id="talks">
      <header class="label reveal"><b>03</b><span>Talks</span></header>
      <div class="rail" id="rail"></div>
    </section>

    <section class="contact" id="contact">
      <header class="label reveal"><b>04</b><span>Contact</span></header>
      <h2 class="headline reveal" id="headline"></h2>
      <a class="cta btn solid reveal" id="email" href="#"><span></span><i>→</i></a>
      <ul class="socials reveal" id="socials"></ul>
      <footer><span id="copyright"></span><span>Made with optimism</span></footer>
    </section>
  </main>

  <script src="js/content.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
